<script>
    const fhirInput = document.getElementById('fhir-input');

    fhirInput.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            document.execCommand('insertText', false, '  ');
        }
    });

    fhirInput.addEventListener('paste', function(e) {
        const pastedText = (e.clipboardData || window.clipboardData).getData('text');
        e.preventDefault();

        // document.execCommand('insertText', false, pastedText);
        e.target.textContent = pastedText

        // Highlight the code
        // this.querySelector('code').classList.add('hljs');
        e.target.removeAttribute("data-highlighted")
        if (window.hljs) hljs.highlightElement(e.target);
    });


    // Highlight drop area on dragover
    fhirInput.addEventListener('dragover', function(e) {
        e.preventDefault();
        fhirInput.classList.add('border-secondary');
        fhirInput.classList.remove('border-primary');
    });

    // Remove highlight on dragleave
    fhirInput.addEventListener('dragleave', function(e) {
        e.preventDefault();
        fhirInput.classList.add('border-primary');
        fhirInput.classList.remove('border-secondary');
    });

    // Handle file drop
    fhirInput.addEventListener('drop', function(e) {
        e.preventDefault();
        fhirInput.classList.remove('border-secondary');
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            fhirInput.classList.add('border-success');
            const file = e.dataTransfer.files[0];
            const reader = new FileReader();
            reader.onload = function(evt) {
                e.target.textContent = evt.target.result;
                e.target.removeAttribute("data-highlighted")
                if (window.hljs) hljs.highlightElement(fhirInput);
            };
            reader.readAsText(file);
        }
    });

    const tutorials = [];
    tutorials.push({
        selector: '#operation-mode',
        title: 'Das Primärsystem für Verordnungen',
        text: 'Im PVS hast du volle Kontrolle über die Verordnungen die ich für dich ausstelle. Aber keine Sorge, wenn du Felder auslässt, werden sie mit zufälligen Werten gefüllt.',
        position: 'bottom'
    });
    tutorials.push({
        selector: 'label[for="hermes-mode"]',
        title: 'Der Standardmodus',
        text: 'Der einfachste Weg E-Rezepte auszustellen. Hermes der Götterbote hilft mir die Verordnungen mit korrekten Werten zu füllen und überbringt sie dann an den Fachdienst! Schneller geht es nicht.',
        position: 'left'
    });
    tutorials.push({
        selector: 'label[for="faker-mode"]',
        title: 'Der Modus ohne Fachdienst',
        text: 'Wenn du aus deinen Eingaben ein valides FHIR-Bundle machen möchtest, ohne es an den Fachdienst zu senden, verwende meinen Faker!',
        position: 'bottom'
    });
    tutorials.push({
        selector: 'label[for="fhir-mode"]',
        title: 'Wenn du genau weißt was du brauchst',
        text: 'Wenn du bereits ein FHIR-Bundle hast, kannst du es mir hier übergeben, und ich sende es direkt an den Fachdienst, ohne das Hermes etwas daran ändert. Was dann passiert geht nur dich und den Fachdienst etwas an 😁',
        position: 'left'
    });
    tutorials.push({
        selector: '#selected-actor',
        title: 'Wer darf verschreiben?',
        text: 'Welcher meiner Akteure soll die Verordnung signieren? Hier kannst du aus allen Akteuren auswählen die diese Fähigkeit besitzen.',
        position: 'bottom'
    });
    tutorials.push({
        selector: '#kvnr',
        title: 'Die KVNR für die Verordnung',
        text: 'Vergiss nicht auch hier eine KVNR anzugeben, sonst denkt sich Hermes eine aus!',
        position: 'right'
    });
    tutorials.push({
        selector: '#send-request',
        title: 'Und los!',
        text: 'Wenn du fertig bist, drücke einfach auf E-Rezept ausstellen und ich kümmere mich um den Rest!',
        position: 'top',
        isLast: true
    });
    Tutorial.setSteps(tutorials);
</script>
