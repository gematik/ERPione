<script src="buttons.js"></script>
<script src="utility.js"></script>
<div class="modal fade" id="headless-token-modal" tabindex="-1" aria-labelledby="headless-token-modal-label" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="headless-token-modal-label">Headless Token</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2 small text-muted" id="headless-token-meta"></div>
        <div class="border rounded p-2 bg-light">
          <div class="d-flex justify-content-between align-items-center">
            <strong>Delegation Token</strong>
            <button id="headless-token-copy-btn" class="btn btn-sm btn-light" type="button" title="Copy token">📋</button>
          </div>
          <div id="headless-token-value" class="mt-2" style="word-break: break-all; font-family: monospace;"></div>
        </div>
        <div id="headless-token-raw-container" class="mt-3"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
