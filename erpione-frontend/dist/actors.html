</head>
<body>
<div id="actors" class="container"></div>
<script>
    const tutorials = [];
    tutorials.push({
        selector: '#nav-item-actors',
        title: 'Mein Gefolge',
        text: 'Hier findest du alle meine loyalen Akteure. In blau meine ÄrztInnen, in grün meine ApothekerInnen und in rot Apotheken aus dem Ausland.',
        position: 'bottom'
    });
    tutorials.push({
        selector: 'button.accordion-button',
        title: 'Ein Arzt',
        text: 'Hier steht der Name unter dem ich mir den Akteur merke, sowie wie er nach außen auftritt. Klicke auf Ihn, um weitere Details zu sehen!',
        position: 'bottom'
    });
    tutorials.push({
        selector: 'button.btn.btn-outline-primary.flex-shrink-0.ms-2.my-2',
        title: 'Name kopieren',
        text: 'Solltest du auf anderen Wegen Kontakt mit mir aufnehmen, musst du mir sagen welchen Akteur ich beauftragen darf. Dieser Name ist perfekt dafür.',
        position: 'right',
        isLast: true
    });

    fetch('/api/actors')
        .then(response => checkForLogin(response))
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('actors');
            createAccordion(container, data, createActorItem);
            Tutorial.setSteps(tutorials);
        })
        .catch(handleUnexpectedFetchError);
</script>
</body>
