<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erpione EU-Apotheke</title>

    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="icon" type="image/png" href="img/favicon.ico">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- highlightjs for highlighting xml/json data  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/atom-one-light.min.css" integrity="sha512-o5v54Kh5PH0dgnf9ei0L+vMRsbm5fvIvnR/XkrZZjN4mqdaeH7PW66tumBoQVIaKNVrLCZiBEfHzRY4JJSMK/Q==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/es/core.min.js" integrity="sha512-GuVoeU19Vs7el8GKo3lq2ogzwCIRBuQDnSL0rtHD4KVq3EymKgG4Uj/SEbbggJ+o+ocAcwdbn8hPSgdVPKdPlQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js" integrity="sha512-EBLzUL8XLl+va/zAsmXwS7Z2B1F9HUHkZwyS/VKwh3S7T/U0nF4BaU29EP/ZSf6zgiIxYAnKLu6bJ8dqpmX5uw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/json.min.js" integrity="sha512-f2/ljYb/tG4fTHu6672tyNdoyhTIpt4N1bGrBE8ZjwIgrjDCd+rljLpWCZ2Vym9PBWQy2Tl9O22Pp2rMOMvH4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <link rel="stylesheet" type="text/css" href="styles.css">

    <script src="env.js"></script>
    <script src="nav.js"></script>
    <script src="utility.js"></script>
    <script src="error-handling.js"></script>
    <script src="eu-pharmacy.js"></script>
    <script src="prescription-search.js"></script>
    <script src="prescription.js"></script>
    <script src="buttons.js"></script>
    <script src="tutorial.js"></script>
</head>
<body>

<form class="container text-start border border-dark-subtle rounded mb-3" id="avs-container">
    <div>
        <h4 style="font-weight: normal !important; padding-top: 0.25rem">EU Apotheke 🇪🇺</h4>
        <div class="input-group mb-3">
            <label for="selected-actor" class="input-group-text" id="country-flag">🇪🇺</label>
            <div class="form-floating">
                <select class="form-select" id="selected-actor">
                    <option selected value="Madrid" data-flag="🇪🇸">Madrid (ES)</option>
                    <option value="Warschau" data-flag="🇵🇱">Warschau (PL)</option>
                    <option value="Prag" data-flag="🇨🇿">Prag (CZ)</option>
                    <option value="Wien" data-flag="🇦🇹">Wien (AT)</option>
                    <option value="Vaduz" data-flag="🇱🇮">Vaduz (LI)</option>
                    <option value="Valletta" data-flag="🇲🇹">Valletta (MT)</option>
                    <option value="Vilnius" data-flag="🇱🇹">Vilnius (LT)</option>
                    <option value="Riga" data-flag="🇱🇻">Riga (LV)</option>
                    <option value="Brussels" data-flag="🇧🇪">Brussels (BE)</option>
                    <option value="Helsinki" data-flag="🇫🇮">Helsinki (FI)</option>
                    <option value="Ljubljana" data-flag="🇸🇮">Ljubljana (SI)</option>
                </select>
                <label for="selected-actor">Identität</label>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="input-group mb-3">
            <label for="selected-flow-step" class="input-group-text">⚕️</label>
            <div class="form-floating">
                <select class="form-select" id="selected-flow-step">
                    <option value="demographics">demografische Daten abrufen</option>
                    <option selected value="prescriptions">alle E-Rezepte abrufen</option>
                </select>
                <label for="selected-flow-step">Zugriffsoperation</label>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="input-group mb-3" id="demographics-input">
            <label for="selected-flow-step" class="input-group-text">🔑</label>
            <div class="form-floating">
                <input type="text" class="form-control" id="kvnr-input" name="kvnr" required>
                <label for="kvnr-input">KVNR</label>
            </div>
            <div class="form-floating">
                <input type="text" class="form-control" id="eu-code-input" name="eu-ac" required>
                <label for="eu-code-input">EU AccessCode</label>
            </div>
        </div>
    </div>
    <div class="row">
        <fieldset class="btn-group d-flex w-100 mb-3" role="group">
            <button type="button" class="btn btn-success" id="eu-pharmacy-btn" onclick="queryNcpeh()">abrufen</button>
        </fieldset>
    </div>
</form>

<form id="prescription-selection-container" class="container border border-light-subtle rounded mb-3 mt-3"></form>

<hr class="mt-3 mb-3">
<div id="response-container" class="container"></div>

<script>
    // set the initial label of the pharmacy button
    (function() { updatePharmacyButtonLabel() })();

    document.getElementById('selected-flow-step').addEventListener('change', function() {
        updatePharmacyButtonLabel();
    });

    document.getElementById('selected-actor').addEventListener('change', function() {
        updatePharmacyButtonLabel();
    });

    const tutorials = [];
    tutorials.push({
        selector: '#avs-container',
        title: 'Meine Verbindung zum NCPeH',
        text: 'Um als europäische Apotheke zu agieren, kannst du hiermit unseren NCPeH simulieren!',
        position: 'bottom'
    });
    tutorials.push({
        selector: '#selected-flow-step',
        title: 'Die Operation auswählen',
        text: 'Standardmäßig ruft mein Gefolge alle Rezepte vom Test-NCPeH ab. Nicht wundern, wenn du die demographischen Daten abrufst, wird dir nur das neuste Rezept angezeigt, dass ist so spezifiziert.',
        position: 'bottom'
    });
    tutorials.push({
        selector: '#demographics-input',
        title: 'Zugangsdaten',
        text: 'Vergiss nicht, sowohl die KVNR als auch den EU AccessCode einzugeben! Den letzteren bekommst du nur von einem FdV.',
        position: 'top'
    });
    tutorials.push({
        selector: '#eu-pharmacy-btn',
        title: 'Zum NCPeH!',
        text: 'Und wie erwartet hier drücken um die Rezepte abzurufen!',
        position: 'bottom'
    });
    Tutorial.setSteps(tutorials);
</script>
</body>
</html>
