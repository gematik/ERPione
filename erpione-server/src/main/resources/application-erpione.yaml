
erpione:
  onlineMode: true
  doctors:
    - mnemonic: Machaon
      smcbIccsn: 80276001011699901102
      hbaIccsn: 80276001011699901501

    - mnemonic: Podaleirios
      smcbIccsn: 80276883110000163953  # Krankenhaus
      hbaIccsn: 80276001011699901344

    - mnemonic: Telesphorus
      smcbIccsn: 80276883110000163952 # Psychotherapeutische Praxis
      hbaIccsn: 80276883110000163949  # Psychotherapeut/-in

  pharmacists:  # "Asclepiades" are daughters of Asklepios, the Greek god of medicine
    - mnemonic: Hygieia
      smcbIccsn: 80276001011699902303 # christine ulmendorfer the only pharmacy we have in VZD
      hbaIccsn: 80276001011699901726

    - mnemonic: Panacea
      smcbIccsn: 80276001011699900861 # Krankenhausapotheke
      hbaIccsn: 80276001011699901726

    - mnemonic: Iaso
      smcbIccsn: 80276883110000163973
      hbaIccsn: 80276001011699901726

    - mnemonic: Akeso
      smcbIccsn: 80276001011699902301 # adelheid ulmendorfer, telematik-id 3-01.2.2023001.16.101
      hbaIccsn: 80276001011699901726

  ktrs: # LEIs/KTRs get mnemonics from regions related to Asklepios and Epione
    - mnemonic: Thessaly
      smcbIccsn: 80276883110000163954

  ncpehs:
    - mnemonic: Madrid
      customName: Farmacia del Sol
      countryCode: ES
      smcbIccsn: ncpeh-smb

    - mnemonic: Warschau
      customName: Apteka Słoneczna
      countryCode: PL
      smcbIccsn: ncpeh-smb

    - mnemonic: Prag
      customName: Lékárna v Centru
      countryCode: CZ
      smcbIccsn: ncpeh-smb

    - mnemonic: Wien
      customName: Edelweiss-Apotheke
      countryCode: AT
      smcbIccsn: ncpeh-smb

    - mnemonic: Vaduz # pharmacy from Lichtenstein
      customName: Fürsten Apotheke
      countryCode: LI
      smcbIccsn: ncpeh-smb

    - mnemonic: Valletta # pharmacy from Malta
      customName: Spiżerija Vitalis
      countryCode: MT
      smcbIccsn: ncpeh-smb

    - mnemonic: Vilnius
      customName: Apotheka Eurovaistine
      countryCode: LT
      smcbIccsn: ncpeh-smb

    - mnemonic: Riga
      customName: Aptieka Avotu
      countryCode: LV
      smcbIccsn: ncpeh-smb

    - mnemonic: Brussels
      customName: Apotheek Du Centre
      countryCode: BE
      smcbIccsn: ncpeh-smb

    - mnemonic: Helsinki
      customName: Kaivopuiston apteekki
      countryCode: FI
      smcbIccsn: ncpeh-smb

    - mnemonic: Ljubljana
      customName: Lekarna Ljubljana Center
      countryCode: SI
      smcbIccsn: ncpeh-smb

