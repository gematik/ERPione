spring:
  application:
    name: Erpione
  profiles:
    active: tu
    include:
      - erpione
      - jackson
      - logging
      - secrets
  main:
    banner-mode: CONSOLE

  datasource:
    url: "jdbc:h2:file:./erpione;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: "SA"
    password: ""
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health #,mappings,info,metrics,trace,httptrace

server:
  forward-headers-strategy: framework
  encoding:
    charset: UTF-8
    enabled: true

springdoc:
  swagger-ui:
    enabled: true
    display-request-duration: true
    use-root-path: true
    tags-sorter: method
    operations-sorter: method
    csrf:
      cookie-name: "XSRF-TOKEN"
      enabled: true
      header-name: "X-XSRF-TOKEN"
  api-docs:
    enabled: true
    path: "/api-docs"
    version: openapi-3-1
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true

---
spring:
  config:
    activate:
      on-profile: loauth
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/erpione
          # Note: this does not work properly!
          #jwk-set-uri: http://keycloak:8080/kc/realms/erpione/protocol/openid-connect/certs

---
spring:
  config:
    activate:
      on-profile: ltudb
  datasource:
    url: "jdbc:h2:file:/home/erpione/data/erpione;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: "erpione"
    password: ""
