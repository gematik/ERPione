worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;
events {
  worker_connections  1024;
}
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;
  sendfile        on;
  keepalive_timeout  65;

  gzip            on;
  gzip_static     on;
  gzip_vary       on;
  gzip_proxied    no-cache no-store private expired auth;
  gzip_min_length 10240;
  gzip_types
  application/javascript
  application/json
  font/woff2
  text/css
  text/plain;

  # ── Common proxy headers (sent for every location) ────────────────────
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
#   proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;

  # ── Buffer settings ───────────────────────────────────────────────────
  proxy_buffering          on;
  proxy_buffer_size        16k;
  proxy_buffers            4 16k;
  proxy_busy_buffers_size  32k;


  proxy_http_version 1.1;
  proxy_intercept_errors on;

  rewrite_log on;

  # ── Upstream: Spring Boot BFF ─────────────────────────────────────────────
  upstream bff {
      server bff:8080;
      keepalive 32;
  }

  upstream keycloak {
      server keycloak:8080;
      keepalive 32;
  }

  upstream resource-server {
      server resource-server:8080;
      keepalive 32;
  }

  server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
  }

  server {
    listen       8080;
    server_name  localhost;
    error_page   404  /404.html;
    port_in_redirect off;
    absolute_redirect off;
    server_tokens off;

    location = /404.html {
      root   /usr/share/nginx/html;
    }
    location / {
        return 302 /ui/index.html;
    }

    location /ui {
      index index.html;
      rewrite /ui/(.*) /$1 break;
      proxy_pass http://erpione-ui:80;
    }

    # Erpione service
    # ─────────────────────────────────────────────────────────────────────
    # Location 1: OAuth2 / OIDC flows → BFF
    #   /oauth2/**  /login/**  /logout
    # ─────────────────────────────────────────────────────────────────────
    location ~ ^/(oauth2|login|logout)(/.*)?$ {
        proxy_intercept_errors off;
        proxy_pass http://bff;

        # Allow cookies to flow through
        proxy_cookie_path / /;
        proxy_cookie_domain bff $host;

        # Timeouts for auth redirects (IdP can be slow)
        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Location 2: API calls → BFF (which relays to resource server)
    # ─────────────────────────────────────────────────────────────────────
    location ~ ^/(bff|api)(/.*)?$ {
        proxy_intercept_errors off;
        proxy_pass http://bff;

        proxy_cookie_path / /;
        proxy_cookie_domain bff $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # keycloak
    location ^~ /kc {
      proxy_pass http://keycloak;
    }

    # serve the OpeanAPI spec
    location = /openapi {
      rewrite ^ /swagger-ui/index.html permanent;
    }
    location ~ ^(/v3)?/api-docs {
        proxy_pass http://resource-server;
    }
    location ^~ /swagger-ui {
        proxy_pass http://resource-server;
    }

    location /actuator/ {
        # Deny public access to all other actuator endpoints
        deny all;
        return 403;
    }
  }
}